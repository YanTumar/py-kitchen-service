{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Dish List</h1>
    <a href="{% url 'kitchen:dish-create' %}" class="btn btn-success shadow-sm">
      + Add New Dish
    </a>
  </div>

  <div class="card shadow-sm border-0 mb-4">
    <div class="card-body p-3">
      <div class="input-group">
        <span class="input-group-text bg-white border-end-0">
          🔍
        </span>
        <input type="text"
               name="search"
               class="form-control border-start-0"
               placeholder="Search dishes by name..."
               hx-get="{% url 'kitchen:dish-list' %}"
               hx-trigger="keyup changed delay:500ms"
               hx-target="#dish-table-body"
               hx-indicator="#loading-spinner">
      </div>
    </div>
  </div>

  <table class="table table-hover shadow-sm bg-white mt-2">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Dish Type</th>
        <th>Cooks</th>
      </tr>
    </thead>
    <tbody id="dish-table-body">
      {% include "kitchen/dish_list_items.html" %}
    </tbody>
  </table>

  <div id="loading-spinner" class="htmx-indicator text-center my-3">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
{% endblock %}
