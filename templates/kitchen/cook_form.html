{% extends "base.html" %}
{% load crispy_forms_tags %} {% block content %}
  <div class="container mt-4">
    <h1>Update Chef Profile</h1>
    <form action="" method="post" class="card p-4 shadow-sm border-0">
      {% csrf_token %}
      {{ form|crispy }} <div class="mt-3">
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a href="{% url 'kitchen:cook-detail' pk=cook.id %}" class="btn btn-link text-secondary">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
