{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <div class="container mt-4">
    <h1>Create New Dish</h1>
    <div class="card p-4 shadow-sm border-0">
      <form action="" method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="mt-3">
          <button type="submit" class="btn btn-primary">Save Dish</button>
          <a href="{% url 'kitchen:dish-list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
